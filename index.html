<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="./assets/css/style.css">
   <script defer type="module" src="./src/main.js"></script>
   <title>Proyecto</title>
</head>
<body>

   <div class="contenedor">
      <h3 style="color: #fff">Seleccione un algoritmo:</h3>
      <section class="bxControles">
         <div class="algoritmos">
            <div class="FCFS algoritmo">FCFS</div>
            <div class="RR algoritmo">RR</div>
            <div class="Prioridad algoritmo">Prioridad</div>
            <div class="SJN algoritmo">SJN</div>
            <div class="SRN algoritmo">SRN</div>
         </div>
         <div class="bxBtn">
            <button class="btnCorrer">Correr</button>
            <button class="btnLimpiar">Limpiar</button>
         </div>
      </section>
      
      <section class="bxProcesos">
         <table class="tablaProcesos">
            <tr>
               <td># Proceso</td>
               <td>t<sub>i</sub></td>
               <td>t</td>
               <td>prioridad</td>
               <td class="tf">t<sub>f</sub></td>
               <td class="T">T</td>
               <td class="E">E</td>
               <td class="I">I</td>
            </tr>
         </table>
         <table class="tablaProcesos">
            <tr>
               <td># Proceso</td>
               <td>t<sub>i</sub></td>
               <td>t</td>
               <td>prioridad</td>
               <td class="tf">t<sub>f</sub></td>
               <td class="T">T</td>
               <td class="E">E</td>
               <td class="I">I</td>
            </tr>
         </table>
      </section>
      
      <div class="bxPromedios">
         <table class="tablaPromedios">
            <tr>
               <td class="bgTransparente"># Proceso</td>
               <td class="bgTransparente">t<sub>i</sub></td>
               <td class="bgTransparente">t</td>
               <td class="bgTransparente">prioridad</td>
               <td class="resultadoT">34</td>
               <td class="resultadoE">43</td>
               <td class="resultadoI">34</td>
            </tr>
         </table>
      </div>

      <section class="bxGrafico">
         <div class="cuadriculas"></div>
      </section>
      
      <section class="bxInfo">
         #<span class="txtNroProceso"></span> T<sub>i</sub>: <span class="txtInicio"></span> T<sub>t</sub>: <span class="txtEjecucion"></span> Prioridad: <span class="txtPrioridad"></span> <br> <span class="clrRojo"> T<sub>f: </sub></span><span class="txtFinal"></span> <span class="clrRojo">T: </span><span class="txtT"></span> <span class="clrRojo">E: </span><span class="txtE"></span> <span class="clrRojo">I: </span><span class="txtI"></span>
      </section>
   </div>
   
   <div class="espacio" style="height: 100vh;"></div>
   
   <div class="bxModal">
      <div class="modal">
         ¡Seleccione un algoritmo!
      </div>
   </div>

   
</body>
</html>
