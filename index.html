<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="./assets/css/style.css">
   <script defer type="module" src="./src/main.js"></script>
   <title>Proyecto</title>
</head>
<body>

   <div class="contenedor">
      <h3 style="color: #fff">Seleccione un algoritmo:</h3>
      <section class="bxControles">
         <div class="algoritmos">
            <div class="FCFS algoritmo">FCFS</div>
            <div class="RR algoritmo">RR</div>
            <div class="Prioridad algoritmo">Prioridad</div>
            <div class="SJN algoritmo">SJN</div>
            <div class="SRN algoritmo">SRN</div>
         </div>
         <div class="bxBtn">
            <button class="btnCorrer">Correr</button>
            <button class="btnLimpiar">Limpiar</button>
         </div>
      </section>

      <div class="bxPromedios">
         Promedio <span class="promedioT">T:</span><span class="resultadoT">...</span> <span class="promedioE">E:</span><span class="resultadoE">...</span> <span class="promedioI">I:</span><span class="resultadoI">...</span>
      </div>
   
      <section class="bxProcesos">
         <table class="tablaProcesos">
            <tr>
               <td># Proceso</td>
               <td>t<sub>i</sub></td>
               <td>t</td>
               <td>prioridad</td>
               <td class="tf">t<sub>f</sub></td>
               <td class="T">T</td>
               <td class="E">E</td>
               <td class="I">I</td>
            </tr>
         </table>
         <table class="tablaProcesos">
            <tr>
               <td># Proceso</td>
               <td>t<sub>i</sub></td>
               <td>t</td>
               <td>prioridad</td>
               <td class="tf">t<sub>f</sub></td>
               <td class="T">T</td>
               <td class="E">E</td>
               <td class="I">I</td>
            </tr>
         </table>
      </section>

      <section class="bxGrafico">
         <div class="cuadriculas"></div>
      </section>

      <section class="bxInfo">
         <span class="txtNroProceso"># Proceso: 3</span> <span class="txtInicio">Tiempo de inicio: 3</span> <span class="txtEjecucion">Tiempo ejecucion: 3</span> <span class="txtPrioridad">Prioridad: 19</span> <br> <span class="txtFinal">Tiempo final: 343</span> <span class="txtT">T: 324</span> <span class="txtE">E: 3434</span> <span class="txtI">I: 342.34</span>
      </section>
   </div>

   <div class="espacio" style="height: 100vh;"></div>

   <div class="bxModal">
      <div class="modal">
         ¡Seleccione un algoritmo!
      </div>
   </div>

   
</body>
</html>
