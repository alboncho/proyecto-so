<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="../../assets/css/planificacion-disco.css">
   <title>Planificaion del Disco</title>
</head>
<body>

   <!-- MENU -->
   <nav class="menu">
      <div class="bxMenuDesplegable ocultar">
         <div class="iconoMenu" onclick="mostrarMenu()">
            <img src="../../assets/img/icono-menu.png" alt="">
         </div>
         <div class="contenidoMenu ocultar">
            <ul>
               <li><a href="../../index.html" style="--clr: #343047">Alg. de Planificacion</a></li>
               <li><a href="./GestionMemoria.html" style="--clr: #ff4d4d">Gestion de Memoria</a></li>
               <li><a href="./PlanificacionDisco.html" style="--clr: #17c0eb">Planif. de Disco</a></li>      
            </ul>
         </div>
      </div>
      <ul class="bxMenu">
         <li><a href="../../index.html" style="--clr: #343047" class=""">Alg. de Planificacion</a></li>
         <li><a href="./GestionMemoria.html" style="--clr: #ff4d4d" class="">Gestion de Memoria</a></li>
         <li><a href="#" style="--clr: #17c0eb" class="active">Planif. del Disco</a></li>
      </ul>
   </nav>
   
   <!-- PRINCIPAL -->
   <div class="contenedor">
      <div class="bxCard">
         <div class="cardHeader">
            <span class="punto"></span>
            <h2>Planificacion del Disco</h4>
         </div>
         <div class="cardBody">
            <div class="bxInputs">
               <div class="inputGrupo">
                  <label for=""><span class="punto" style="--clr: #F52798"></span> Cola de peticiones</label>
                  <textarea name="" id="cola-peticiones">3,3,2,</textarea>
               </div>
               <div class="inputGrupo">
                  <label for=""><span class="punto" style="--clr: #F52798"></span> Posicion inicla del cabezal</label>
                  <input type="number" step="1" value="35">
               </div>
               <div class="inputGrupo">
                  <label for=""><span class="punto" style="--clr: #F52798"></span> Algoritmos</label>
                  <select name="" id="algoritmos">
                     <option value="fcfs">FCFS</option>
                     <option value="sstf">SSTF</option>
                     <option value="scan">SCAN</option>
                  </select>
               </div>
               <div class="inputGrupo">
                  <label for=""><span class="punto" style="--clr: #F52798"></span> Direccion SCAN</label>
                  <select name="" id="direccion-scan">
                     <option value="abajo">Hacia cilindros menores(↑)</option>
                     <option value="arriba">Hacia cilindros mayores(↓)</option>
                  </select>
               </div>
               <div class="inputGrupo">
                  <label for=""><span class="punto" style="--clr: #F52798"></span> Cilindro maximo (SCAN)</label>
                  <input type="number" step="1" value="200">
               </div>
            </div>

            <!-- BOTONES -->
            <div class="bxBotones">
               <button class="btnCorrer">
                  <img src="../../assets/img/correr-icono.png" style="width: 15px; height: 15px" alt="">
                  Correr
               </button>
               <button class="btnLimpiar">
                  Limpiar
               </button>
            </div>
         </div>
      </div>
   </div>

   <script type="module" src="../disco.js"></script>

</body>
</html>
